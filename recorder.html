<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SeeNARIO motion recorder</title>
<style>body{font-family:system-ui,sans-serif;max-width:480px;margin:24px auto;padding:0 16px;background:#14101a;color:#eee}
button,select,input{font-size:18px;padding:12px;margin:6px 0;width:100%;box-sizing:border-box}
progress{width:100%;height:18px}#s{margin:10px 0;font-size:18px}small{color:#aaa}
#list a{display:block;background:#1f7a3a;color:#fff;padding:14px;margin:8px 0;border-radius:8px;text-decoration:none;font-size:17px}</style></head>
<body>
<h2>Motion recorder</h2>
<small>Phone in the same spot and orientation for every recording. Stumble files: stagger or stop every 1–2 s the whole time, on flat ground.</small>
<input id="who" placeholder="Your first name (used in file names)">
<select id="label"><option>standing</option><option>walking</option><option>stumble</option></select>
<button id="go">Start (5 s countdown, then 60 s)</button>
<button id="stop" disabled>Cancel recording</button>
<progress id="p" value="0" max="60"></progress>
<div id="s">Idle</div>
<h3>Recordings (tap each green link to save it)</h3>
<div id="list"><small>Nothing recorded yet.</small></div>
<script>
const RATE = 50, SECONDS = 60, G = 9.80665, STEP = 1000 / RATE;
let last = null, cancelled = false, lock = null;
const counts = {}, $ = (id) => document.getElementById(id);
addEventListener("devicemotion", (e) => {
  const a = e.accelerationIncludingGravity;
  if (a && a.x != null) last = { x: a.x / G, y: a.y / G, z: a.z / G };
});
$("stop").onclick = () => (cancelled = true);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
$("go").onclick = async () => {
  const who = $("who").value.trim().toLowerCase().replace(/[^a-z0-9]/g, "");
  if (!who) return ($("s").textContent = "Type your first name first.");
  if (typeof DeviceMotionEvent !== "undefined" && DeviceMotionEvent.requestPermission) {
    if ((await DeviceMotionEvent.requestPermission()) !== "granted") return ($("s").textContent = "Motion permission denied");
  }
  const label = $("label").value;
  cancelled = false; $("go").disabled = true; $("stop").disabled = false;
  try { lock = await navigator.wakeLock.request("screen"); } catch (e) {} // keep screen on
  for (let i = 5; i > 0 && !cancelled; i--) { $("s").textContent = "Get ready… " + i; await sleep(1000); }
  if (!cancelled && !last) { $("s").textContent = "No sensor data. Use a phone over HTTPS."; cancelled = true; }
  const rows = [];
  if (!cancelled) {
    const t0 = performance.now(); let next = t0;
    while (!cancelled) { // clock-based: add one sample per elapsed 20 ms slot, so timer lag can't change the length
      const now = performance.now();
      while (next <= now && rows.length < RATE * SECONDS) { rows.push(last); next += STEP; }
      const el = Math.min((now - t0) / 1000, SECONDS);
      $("p").value = el; $("s").textContent = `Recording ${label}… ${el.toFixed(0)} / ${SECONDS} s`;
      if (rows.length >= RATE * SECONDS) break;
      await sleep(30);
    }
  }
  $("go").disabled = false; $("stop").disabled = true; $("p").value = 0;
  if (lock) { lock.release(); lock = null; }
  if (cancelled) return ($("s").textContent = "Cancelled. Nothing saved.");
  const m = rows.map((r) => Math.hypot(r.x, r.y, r.z)), mu = m.reduce((a, b) => a + b, 0) / m.length;
  const sd = Math.sqrt(m.reduce((a, b) => a + (b - mu) ** 2, 0) / m.length);
  const key = who + label; counts[key] = (counts[key] || 0) + 1;
  const name = `${label}_${who}_${String(counts[key]).padStart(2, "0")}.csv`;
  const csv = "ax,ay,az\n" + rows.map((r) => `${r.x.toFixed(4)},${r.y.toFixed(4)},${r.z.toFixed(4)}`).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = name;
  a.textContent = `⬇ Save ${name} (${rows.length} samples, movement ${sd.toFixed(2)})`;
  if ($("list").querySelector("small")) $("list").innerHTML = "";
  $("list").prepend(a);
  $("s").textContent = `Done: ${name}. Tap the green link below to save it.`;
};
</script></body></html>
